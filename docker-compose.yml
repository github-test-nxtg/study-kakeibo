services:
  # ビルド・型チェック・単体テスト用
  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    command: sh -c "npm install && npm run check"

  # 画面操作テスト（E2E）用。ブラウザ入りの公式イメージ
  # ※ タグのバージョンは package.json の @playwright/test と必ず揃える
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    init: true
    ipc: host
    environment:
      - CI=1
    command: sh -c "npm install && npm run test:all"

volumes:
  node_modules:
